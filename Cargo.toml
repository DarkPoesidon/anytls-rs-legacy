[package]
name = "anytls"
version = "0.2.2"
edition = "2024"
authors = ["anytls-rs contributors"]
description = "A proxy protocol that attempts to mitigate the TLS in TLS fingerprinting problem"
license = "MIT"
repository = "https://github.com/ssrlive/anytls-rs"
keywords = ["proxy", "tls", "privacy", "networking"]
categories = ["network-programming", "command-line-utilities"]

[features]
default = ["client", "server"]
core = []
runtime = ["core", "dep:async-trait", "dep:futures", "dep:tokio"]
uot = ["dep:socks5-impl", "dep:tokio"]
client = [
    "runtime",
    "uot",
    "dep:clap",
    "dep:env_logger",
    "dep:indexmap",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:socket2",
    "dep:socks5-impl",
    "dep:tokio-rustls",
]
server = [
    "runtime",
    "uot",
    "dep:clap",
    "dep:env_logger",
    "dep:rcgen",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:sha2",
    "dep:socket2",
    "dep:socks5-impl",
    "dep:tokio-rustls",
]

[[bin]]
name = "anytls-client"
path = "src/bin/client.rs"
required-features = ["client"]

[[bin]]
name = "anytls-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dependencies]
async-trait = { version = "0.1.89", optional = true }
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive", "cargo"], optional = true }
env_logger = { version = "0.11.10", optional = true }
futures = { version = "0.3.32", optional = true }
indexmap = { version = "2.14.0", optional = true }
log = "0.4.29"
md5 = "0.8.0"
parking_lot = "0.12.5"
rand = "0.10.1"
rcgen = { version = "0.14.7", optional = true }
rustls = { version = "0.23.39", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
socket2 = { version = "0.6.3", optional = true }
socks5-impl = { version = "0.8.1", features = ["server"], optional = true }
tokio = { version = "1.52.1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26.4", optional = true }
