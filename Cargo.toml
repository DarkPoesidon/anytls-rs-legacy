[package]
name = "anytls-rs"
version = "0.1.0"
edition = "2024"
authors = ["anytls-rs contributors"]
description = "A proxy protocol that attempts to mitigate the TLS in TLS fingerprinting problem"
license = "MIT"
repository = "https://github.com/anytls/anytls-rs"
keywords = ["proxy", "tls", "privacy", "networking"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "anytls-client"
path = "src/bin/client.rs"

[[bin]]
name = "anytls-server"
path = "src/bin/server.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1.0"
clap = { version = "4.0", features = ["derive", "cargo"] }
dashmap = "6"
env_logger = "0.11"
futures = "0.3"
hex = "0.4"
indexmap = "2.0"
log = "0.4"
md5 = "0.8"
parking_lot = "0.12"
rand = "0.9"
rcgen = "0.14"
rustls = "0.23"
rustls-pemfile = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6.1"
socks5-impl = { version = "0.8.0", features = ["server"] }
thiserror = "2"
tokio = { version = "1.0", features = ["full"] }
tokio-rustls = "0.26"
url = "2.0"
x509-parser = "0.18"
